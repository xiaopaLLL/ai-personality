<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>E2E · 新版 8 机体问卷自动答题驱动</title>
<style>
  body { background:#07100b; color:#e9eedf; font-family: Consolas, monospace; margin:0; padding:12px; }
  #log { white-space: pre-wrap; font-size: 13px; line-height: 1.55; margin: 0 0 14px; }
  iframe { width: 1000px; height: 380px; border: 1px solid #24331f; }
  .bad { color:#fb7185 } .ok { color:#d9f24a }
</style>
</head>
<body>
<pre id="log">running…</pre>

<!-- 1) 完整答题流程（正常作答 → 结果 → 本地记录） -->
<iframe id="quizFrame" src="../index.html"></iframe>
<!-- 2) 分享落地页（新版 slug） -->
<iframe id="shareFrame" src="../index.html?type=machine-soul"></iframe>
<!-- 3) 旧版 16 型分享链接 -->
<iframe id="legacyFrame" src="../index.html?result=EWSP"></iframe>
<!-- 4) 全中性作答（并列候选） -->
<iframe id="neutralFrame" src="../index.html"></iframe>

<script>
var lines = [];
function log(s) {
  lines.push(s);
  var el = document.getElementById('log');
  el.textContent = lines.join('\n');
  if (s.indexOf('FAIL') >= 0) el.className = 'bad';
}
function check(name, cond, extra) {
  log((cond ? 'RESULT PASS ' : 'RESULT FAIL ') + name + (cond ? '' : '  ← ' + (extra === undefined ? 'false' : extra)));
}
function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
function waitFor(fn, timeout, interval) {
  timeout = timeout || 10000; interval = interval || 60;
  var t0 = Date.now();
  return new Promise(function (resolve, reject) {
    (function tick() {
      var v;
      try { v = fn(); } catch (e) { v = null; }
      if (v) return resolve(v);
      if (Date.now() - t0 > timeout) return reject(new Error('等待超时'));
      setTimeout(tick, interval);
    })();
  });
}
function frame(id) {
  var f = document.getElementById(id);
  return { f: f, w: f.contentWindow, d: f.contentDocument };
}
function visibleText(doc) {
  return (doc.body && doc.body.innerText || '').replace(/\s+/g, ' ');
}

// 尽早挂错误监听，捕获被测页面的 JS 异常
['quizFrame', 'shareFrame', 'legacyFrame', 'neutralFrame'].forEach(function (id) {
  var f = document.getElementById(id);
  try {
    f.contentWindow.addEventListener('error', function (e) {
      log('RESULT FAIL [' + id + '] 页面 JS 错误: ' + e.message);
    });
  } catch (e) { /* ignore */ }
});

// 正常作答的选项序列：原始分 (7,6,3,2) → 唯一命中机魂总调度，四个维度分档不同
var NORMAL_SEQ = [2, 0, 1, 1, 1, 1, 2, 0, 1, 0, 1, 2, 2, 1, 2, 0];
// 全中性作答：每题选主维度 0 分选项
var NEUTRAL_SEQ = [1, 2, 0, 2, 1, 2, 0, 1, 1, 2, 0, 0, 0, 2, 1, 0];

async function answerAll(qd, qw, seq) {
  for (var i = 0; i < seq.length; i++) {
    await waitFor(function () {
      return qd.getElementById('screen-result') &&
        !qd.getElementById('screen-result').classList.contains('hidden') ||
        (qd.querySelectorAll('#options .option').length === 3);
    });
    if (!qd.getElementById('screen-result').classList.contains('hidden')) break;
    var btns = qd.querySelectorAll('#options .option');
    if (!btns.length) throw new Error('第 ' + (i + 1) + ' 题没有选项');
    btns[seq[i]].click();
    await sleep(320);
  }
  await waitFor(function () {
    return !qd.getElementById('screen-result').classList.contains('hidden') &&
      qd.querySelector('[data-type-name]');
  }, 8000);
}

async function runNormal() {
  var f = frame('quizFrame');
  var qw = f.w, qd = f.d;
  await waitFor(function () { return qd.getElementById('typeGallery') && qd.getElementById('typeGallery').children.length === 8; });

  /* ---------------- 首屏静态检查 ---------------- */
  check('首屏渲染 8 个机体名称（文字目录）', qd.getElementById('typeGallery').children.length === 8,
    qd.getElementById('typeGallery').children.length);
  var galleryItems = qd.querySelectorAll('#typeGallery .type-item');
  var firstRoundNames = ['机魂总调度', '霓虹树洞', '数据潜航员', '义体拆解客', '人机调音师', 'DDL领航员', '协议铸造师', '外脑快修侠'];
  var namesOk = galleryItems.length === 8;
  for (var gi = 0; gi < galleryItems.length; gi++) {
    if (firstRoundNames[gi] !== galleryItems[gi].textContent.trim()) namesOk = false;
  }
  check('八个机体名称顺序正确、只有中文名', namesOk);
  check('首屏不再加载任何 8 机体图片', qd.querySelectorAll('#screen-intro img').length === 0,
    qd.querySelectorAll('#screen-intro img').length);
  check('首屏标题为「AI 协作机体测试」', /AI 协作机体测试/.test(qd.getElementById('introTitle').textContent),
    qd.getElementById('introTitle').textContent);
  check('信息条题数为 16、机体数为 8',
    qd.getElementById('specCount').textContent === '16' && qd.getElementById('specTypes').textContent === '8');

  /* ---------------- 前端无后台入口 / 无后端状态 ---------------- */
  var html = qd.documentElement.outerHTML;
  check('首页不存在 admin 链接', qd.querySelectorAll('a[href*="admin"]').length === 0);
  check('首页不出现「数据后台 / 云端 / 本地预览模式」字样',
    !/数据后台|数据已接入云端|本地预览模式|已接入云端/.test(visibleText(qd)));
  check('首页源码不含 admin.html / backendChip',
    html.indexOf('admin.html') < 0 && html.indexOf('backendChip') < 0);

  /* ---------------- 未勾选同意不能开始 ---------------- */
  qd.getElementById('startBtn').click();
  await sleep(120);
  check('未勾选同意时不会进入答题页', qd.getElementById('screen-quiz').classList.contains('hidden'));
  check('未勾选同意时给出提示', !qd.getElementById('startHint').hidden);

  /* ---------------- 正常答题 ---------------- */
  qd.getElementById('consent').checked = true;
  qd.getElementById('consent').dispatchEvent(new Event('change'));
  qd.getElementById('nickname').value = 'e2e测试';
  qd.getElementById('startBtn').click();
  await waitFor(function () { return !qd.getElementById('screen-quiz').classList.contains('hidden'); });
  check('勾选同意后进入答题页', true);
  check('第 1 题渲染 3 个选项', qd.querySelectorAll('#options .option').length === 3,
    qd.querySelectorAll('#options .option').length);
  check('第 1 题题干非空', qd.getElementById('qText').textContent.length > 5);

  await answerAll(qd, qw, NORMAL_SEQ).catch(function (e) { check('正常答题流程完成', false, e.message); });
  await waitFor(function () {
    return !qd.getElementById('screen-result').classList.contains('hidden') &&
      qd.querySelector('[data-type-name]');
  }, 12000);

  /* ---------------- 结果页检查 ---------------- */
  var name = qd.querySelector('[data-type-name]').textContent.trim();
  var img = qd.querySelector('[data-type-image]');
  var visible = visibleText(qd);
  check('结果页显示八种机体之一的中文名', ['机魂总调度', '霓虹树洞', '数据潜航员', '义体拆解客', '人机调音师', 'DDL领航员', '协议铸造师', '外脑快修侠'].indexOf(name) >= 0, name);
  check('结果页带人物图片且路径在 assets/img', !!(img && /assets\/img\/m0[1-8]\.webp/.test(img.getAttribute('src') || '')), img && img.getAttribute('src'));
  check('结果图真实加载', !!(img && img.complete && img.naturalWidth > 0), img && img.naturalWidth);
  check('结果页不显示 M01–M08 编号', !/M0[1-8]/.test(visible), visible.slice(0, 80));
  check('结果页不显示四字母人格代号', !/\b(E|D)(W|L)(S|I)(P|C)\b/.test(visible));
  var rows = qd.querySelectorAll('#screen-result .dim-row');
  check('结果页展示 4 条四维倾向', rows.length === 4, rows.length);
  var pctOk = true;
  rows.forEach && rows.forEach(function (row) {
    var ps = row.querySelectorAll('.dim-pct');
    if (ps.length === 2) {
      var l = parseInt(ps[0].textContent, 10);
      var r = parseInt(ps[1].textContent, 10);
      if (!(l + r === 100)) pctOk = false;
    } else { pctOk = false; }
  });
  check('每条维度左右百分比相加为 100', pctOk);
  check('结果页包含优势 / 边界 / 尝试三块内容',
    /偏好与优势/.test(visible) && /容易忽略的边界/.test(visible) && /可以尝试/.test(visible));
  check('结果页包含对照机体', /对照机体/.test(visible));
  check('结果页未出现上传/云端类提示', !/已上传|已记录|云端|后台/.test(visible));

  /* ---------------- 本地数据层记录 ---------------- */
  var raw = qw.localStorage.getItem('aipt:local:v2');
  var recs = raw ? JSON.parse(raw) : [];
  var rec = recs[0];
  check('完成后本地数据层留下记录', Array.isArray(recs) && recs.length === 1, recs.length);
  check('记录结果编号为 M01（内部字段）', rec && rec.result_code === 'M01', rec && rec.result_code);
  check('记录结果名为「机魂总调度」', rec && rec.result_name === '机魂总调度', rec && rec.result_name);
  check('记录里包含并列/距离匹配元数据', rec && rec.percents && rec.percents.match &&
    rec.percents.match.profileCode === 'EWSP' &&
    Array.isArray(rec.percents.match.candidates) && rec.percents.match.candidates.length === 1,
    rec && rec.percents && rec.percents.match && rec.percents.match.profileCode);
  check('记录含 16 题作答明细', rec && rec.answered === 16 && rec.answer_detail && rec.answer_detail.length === 16);
}

async function runNeutral() {
  var f = frame('neutralFrame');
  var qw = f.w, qd = f.d;
  await waitFor(function () { return qd.getElementById('typeGallery') && qd.getElementById('typeGallery').children.length === 8; });
  qw.localStorage.removeItem('aipt:progress:v2');
  qd.getElementById('consent').checked = true;
  qd.getElementById('consent').dispatchEvent(new Event('change'));
  qd.getElementById('startBtn').click();
  await waitFor(function () { return !qd.getElementById('screen-quiz').classList.contains('hidden'); });
  await answerAll(qd, qw, NEUTRAL_SEQ);
  var visible = visibleText(qd);
  check('全中性结果页出现并列提示', /并列候选/.test(visible));
  check('全中性结果页列出 8 个候选机体', qd.querySelectorAll('#screen-result .tie-item').length === 8,
    qd.querySelectorAll('#screen-result .tie-item').length);
  check('全中性结果页说明展示只是并列之一', /并列候选之一/.test(visible));
  var recs = JSON.parse(qw.localStorage.getItem('aipt:local:v2') || '[]');
  var rec = recs[0];
  check('全中性记录候选 8 个、allNeutral=true',
    rec && rec.percents.match.candidates.length === 8 && rec.percents.match.allNeutral === true,
    rec && rec.percents && rec.percents.match && rec.percents.match.candidates && rec.percents.match.candidates.length);
}

async function runShare() {
  var f = frame('shareFrame');
  await waitFor(function () { return f.d.querySelector('[data-type-name]'); });
  var name = f.d.querySelector('[data-type-name]').textContent.trim();
  var img = f.d.querySelector('[data-type-image]');
  check('分享落地页显示「机魂总调度」', name === '机魂总调度', name);
  check('分享落地页显示人物图片', !!(img && /assets\/img\/m01\.webp/.test(img.getAttribute('src') || '')), img && img.getAttribute('src'));
  check('分享落地页不显示机体编号', !/M0[1-8]/.test(visibleText(f.d)));
  check('分享落地页有「我也测一次」按钮', !!f.d.getElementById('sharedStart'));
}

async function runLegacy() {
  var f = frame('legacyFrame');
  await waitFor(function () { return /旧版/.test(visibleText(f.d)); });
  check('旧版 16 型链接显示旧版下线提示', /旧版 16 型结果已经下线/.test(visibleText(f.d)));
  check('旧版链接页不展示旧类型', !/提示词总导演|脑洞共创官|EWSP/.test(visibleText(f.d)));
}

window.addEventListener('load', function () { run(); });

async function run() {
  try {
    await runNormal();
    await runShare();
    await runLegacy();
    await runNeutral();
    var passed = lines.filter(function (s) { return s.indexOf('RESULT PASS') === 0; }).length;
    var failed = lines.filter(function (s) { return s.indexOf('RESULT FAIL') === 0; }).length;
    log('SUMMARY passed=' + passed + ' failed=' + failed);
  } catch (e) {
    check('E2E 总流程', false, e && e.message);
    log('SUMMARY passed=0 failed=1');
  }
}
</script>
</body>
</html>
