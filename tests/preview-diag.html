<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>预览：后台诊断面板</title>
<style>
  html, body { margin: 0; background: #070716; }
  iframe { display: block; width: 100%; height: 1250px; border: 0; }
</style>
</head>
<body>
<!-- 这个页面由 tests/mock-server.mjs 提供，所以 admin.html 会拿到「模拟 Supabase」的配置 -->
<iframe id="a" src="/admin.html"></iframe>
<script>
window.addEventListener('load', async function () {
  var w = document.getElementById('a').contentWindow;
  var d = w.document;
  var sleep = function (ms) { return new Promise(function (r) { setTimeout(r, ms); }); };
  // 等登录页出现
  for (var i = 0; i < 200 && d.getElementById('viewLogin').classList.contains('hidden'); i++) await sleep(50);
  d.getElementById('loginEmail').value = 'admin@test.com';
  d.getElementById('loginPwd').value = 'secret123';
  d.getElementById('diagBtnLogin').click();
  // 等诊断跑完（出现「账号密码可以登录」这一行）
  for (var j = 0; j < 300 && !/账号密码可以登录/.test(d.getElementById('diagBoxLogin').textContent); j++) await sleep(50);
  document.title = 'diag-ready';
});
</script>
</body>
</html>
